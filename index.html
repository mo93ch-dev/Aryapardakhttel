<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آریا پرداخت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
--primary:#3cb371; /* نعنایی */
--bg:#f4f6f9;
--card:#ffffff;
--text:#000;
--chat-bg:#e5ddd5;
--my-msg:#dcf8c6;
}

body.dark{
--primary:#2e7d32;
--bg:#121212;       /* کل پس‌زمینه تاریک */
--card:#1c1c1c;     /* کارت ها و منو ها */
--text:#f1f1f1;     /* متن ها روشن */
--chat-bg:#1c1c1c;  /* پس‌زمینه چت */
--my-msg:#2e7d32;   /* پیام های کاربر */
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn',sans-serif}
body{
background:var(--bg);
color:var(--text);
transition:.3s;
overflow-x:hidden;
cursor: default;
}

/* HEADER */
header{
background:var(--primary);
color:#fff;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:600;
transition:.3s;
}

/* MAIN MENU */
.main-menu{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
padding:20px;
transition:0.5s ease;
opacity:1;
transform:translateX(0);
}

.main-menu.hidden{
opacity:0;
transform:translateX(100%);
}

.menu-item{
background:var(--card);
padding:20px 10px;
border-radius:18px;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
transition:.25s;
cursor:pointer;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
text-decoration:none;
color:var(--text);
}

.menu-item:hover{
transform:translateY(-5px);
}

.menu-icon{
font-size:32px;
color:var(--primary);
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
right:0;
width:260px;
height:100%;
background:var(--card);
transform:translateX(100%);
transition:.35s cubic-bezier(.4,0,.2,1);
z-index:2000;
padding:20px;
box-shadow:-5px 0 25px rgba(0,0,0,.2);
border-radius:0 0 0 20px;
}

.sidebar.open{
transform:translateX(0);
}

.sidebar button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:var(--primary);
color:#fff;
cursor:pointer;
font-weight:600;
font-size:16px;
margin-bottom:15px;
transition:.3s;
}

body.dark .sidebar button{
background:#2e7d32;
color:#f1f1f1;
}

/* SEARCH MODAL */
.search-modal{
position:absolute;
top:50px;
right:15px;
width:250px;
background:var(--card);
padding:15px;
border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,0.2);
display:none;
z-index:2500;
transition:.3s;
color:var(--text);
}

/* BACKDROP */
.backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
opacity:0;
visibility:hidden;
transition:.3s;
z-index:1500;
}

/* CLOUD CHAT */
.cloud-page{
position:fixed;
inset:0;
background:var(--chat-bg);
display:none;
flex-direction:column;
z-index:3000;
transition:.3s;
}

.cloud-page .chat-header{
background:var(--primary);
color:#fff;
padding:15px;
display:flex;
align-items:center;
gap:10px;
font-weight:600;
transition:.3s;
}

body.dark .cloud-page .chat-header{
background:#2e7d32;
color:#f1f1f1;
}

.chat-body{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
color:var(--text);
}

.message{
max-width:70%;
padding:10px 14px;
border-radius:16px;
background:var(--my-msg);
align-self:flex-end;
animation:fadeIn .2s ease;
color:#fff;
}

.chat-input{
display:flex;
padding:10px;
background:var(--card);
gap:10px;
}

.chat-input input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
outline:none;
background:var(--card);
color:var(--text);
}

.chat-input button{
padding:10px 15px;
border:none;
border-radius:20px;
background:var(--primary);
color:#fff;
cursor:pointer;
}

.back-to-home{
font-size:18px;
font-weight:600;
cursor:pointer;
color:var(--text);
}

/* ICON SIZE */
.top-right-btn img, .top-right-cloud{
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;
object-fit:cover;
border-radius:4px;
font-size:50px;
}

img.tab-icon{
width:100px; /* صفحه اصلی */
height:100px;
object-fit:cover;
border-radius:5px;
}

/* ANIMATION */
@keyframes fadeIn{
from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<header>
  <div class="icon" onclick="toggleMenu()">☰</div>
  <div>آریا پرداخت</div>
  <div style="display:flex;gap:10px;align-items:center">
    <div class="icon top-right-btn" onclick="openTabToEarn()">
      <img src="https://cdn.imgurl.ir/uploads/d60515_3190.png">
    </div>
    <div class="icon top-right-cloud" onclick="openCloud()">☁</div>
    <div class="icon" onclick="toggleSearch()">⋮</div>
  </div>
</header>

<div class="main-menu" id="homePage">
  <a href="https://mo93ch-dev.github.io/havale" class="menu-item">
    <div class="menu-icon">💸</div>
    <div>حواله</div>
  </a>
  <a href="https://mo93ch-dev.github.io/havale" class="menu-item">
    <div class="menu-icon">🌐</div>
    <div>اینترنت</div>
  </a>
  <a href="https://mo93ch-dev.github.io/havale" class="menu-item">
    <div class="menu-icon">📱</div>
    <div>شارژ</div>
  </a>
  <a href="https://mo93ch-dev.github.io/havale" class="menu-item">
    <div class="menu-icon">💎</div>
    <div>الماس</div>
  </a>
  <a href="https://mo93ch-dev.github.io/havale" class="menu-item">
    <div class="menu-icon">🎮</div>
    <div>بازی</div>
  </a>
  <a href="#" onclick="openCalculator()" class="menu-item">
    <div class="menu-icon">💱</div>
    <div>ماشین حساب ارز</div>
  </a>
  <a href="https://t.me/premium" class="menu-item">
    <div class="menu-icon">📩</div>
    <div>تلگرام پریمیوم</div>
  </a>
  <a href="https://mo93ch-dev.github.io/tabtoearn" class="menu-item">
    <div class="menu-icon">
      <img class="tab-icon" src="https://cdn.imgurl.ir/uploads/d60515_3190.png">
    </div>
    <div>تب تو ارن</div>
  </a>
</div>

<div class="sidebar" id="sidebar">
<h3 style="margin-bottom:20px">تنظیمات</h3>
<button onclick="toggleTheme()">🌞 / 🌙 تغییر تم</button>
<button onclick="window.open('https://t.me/mogomogo','_blank')">💬 پشتیبانی</button>
<button onclick="openCalculator()">💱 مبدل پول</button>
</div>

<div class="search-modal" id="searchModal">
<input type="text" placeholder="جستجو...">
</div>

<div class="backdrop" id="backdrop" onclick="closeMenu()"></div>

<div class="cloud-page" id="cloudPage">
<div class="chat-header">
<span class="back-to-home" onclick="goHome()">← بازگشت</span>
<span>پیام‌های ذخیره شده</span>
</div>
<div class="chat-body" id="chatBody"></div>
<div class="chat-input">
<input type="text" id="msgInput" placeholder="پیام خود را بنویسید...">
<button onclick="sendMessage()">ارسال</button>
</div>
</div>

<div class="cloud-page" id="calculatorPage">
<div class="chat-header">
<span class="back-to-home" onclick="goHome()">← بازگشت</span>
<span>ماشین حساب ارز</span>
</div>
<div style="padding:20px;">
<input type="number" id="amount" placeholder="مبلغ را وارد کنید" style="width:100%;margin-bottom:10px;padding:12px;border-radius:12px;border:1px solid #ccc;background:var(--card);color:var(--text)">
<select id="rate" style="width:100%;margin-bottom:10px;padding:12px;border-radius:12px;border:1px solid #ccc;background:var(--card);color:var(--text)">
<option value="58000">دلار (58000 تومان)</option>
<option value="63000">یورو (63000 تومان)</option>
<option value="7000">درهم (7000 تومان)</option>
</select>
<button onclick="calculate()" style="width:100%;padding:12px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;">محاسبه</button>
<div class="result" id="result" style="margin-top:10px;font-weight:bold;"></div>
</div>

<script>
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("open");
document.getElementById("backdrop").classList.toggle("show");
}
function closeMenu(){
document.getElementById("sidebar").classList.remove("open");
document.getElementById("backdrop").classList.remove("show");
}
function toggleTheme(){document.body.classList.toggle("dark");}
function openCloud(){document.getElementById("cloudPage").style.display="flex";}
function closeCloud(){document.getElementById("cloudPage").style.display="none";}
function toggleSearch(){
let modal=document.getElementById("searchModal");
modal.style.display=(modal.style.display==="block")?"none":"block";
}
function sendMessage(){
let input=document.getElementById("msgInput");
if(input.value.trim()==="") return;
let msg=document.createElement("div");
msg.className="message";
msg.innerText=input.value;
document.getElementById("chatBody").appendChild(msg);
input.value="";
document.getElementById("chatBody").scrollTop=9999;
}
function openCalculator(){document.getElementById("calculatorPage").style.display="flex";}
function closeCalculator(){document.getElementById("calculatorPage").style.display="none";}
function openTabToEarn(){window.open('https://mo93ch-dev.github.io/tabtoearn','_blank');}
function calculate(){
let amount=document.getElementById("amount").value;
let rate=document.getElementById("rate").value;
let total=amount*rate;
document.getElementById("result").innerText="مبلغ نهایی: "+total.toLocaleString()+" تومان";
}
function goHome(){
let home=document.getElementById("homePage");
home.classList.add("hidden");
setTimeout(()=>{
home.classList.remove("hidden");
home.scrollIntoView({behavior:"smooth"});
document.getElementById("calculatorPage").style.display="none";
document.getElementById("cloudPage").style.display="none";
},50);
}

// بستن منو وقتی روی هر جای صفحه اصلی لمس شد
document.getElementById("homePage").addEventListener("click", ()=>{
  closeMenu();
});
</script>

</body>
</html>
